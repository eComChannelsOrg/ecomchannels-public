<!doctype html>
<html><head><meta charset="utf-8"><title>example tiles</title>
<style>
html,body{margin:0;width:720px;height:720px;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif}
.tile{width:720px;height:720px;position:relative;overflow:hidden;display:none}
.tile.on{display:block}
/* before: dim, off-centre phone snapshot on a cluttered desk */
#before{background:linear-gradient(160deg,#8d8574,#6f6a60 60%,#5b574f)}
#before .desk{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(180deg,#7b6a55,#5e5040)}
#before .clutter1{position:absolute;left:40px;bottom:150px;width:170px;height:110px;background:#a99f8f;border-radius:6px;transform:rotate(-8deg);box-shadow:0 8px 14px rgba(0,0,0,.3)}
#before .clutter2{position:absolute;right:30px;bottom:170px;width:120px;height:160px;background:#4c5a63;border-radius:10px;transform:rotate(6deg)}
#before .clutter3{position:absolute;left:250px;bottom:60px;width:260px;height:40px;background:#3e3a34;border-radius:20px;transform:rotate(3deg)}
#before svg{position:absolute;left:330px;top:120px;width:240px;height:480px;transform:rotate(9deg);filter:brightness(.72) saturate(.55) contrast(.85) blur(.6px)}
#before .glare{position:absolute;inset:0;background:radial-gradient(260px 200px at 75% 18%,rgba(255,255,240,.35),transparent 70%)}
/* after: hero */
#hero{background:#fff}
#hero svg{position:absolute;left:250px;top:70px;width:220px;height:560px;filter:drop-shadow(0 30px 30px rgba(15,30,54,.18))}
#hero .badge{position:absolute;left:36px;top:36px;background:linear-gradient(135deg,#0a6cf1,#06c2f6);color:#fff;font-weight:800;padding:10px 16px;border-radius:999px;font-size:22px}
#hero .shadow{position:absolute;left:240px;top:640px;width:240px;height:22px;border-radius:50%;background:radial-gradient(rgba(15,30,54,.25),transparent 70%)}
/* after: infographic */
#info{background:linear-gradient(180deg,#f3f8ff,#e6f1ff)}
#info h2{position:absolute;left:40px;top:28px;margin:0;font-size:40px;color:#0b1a33;letter-spacing:-.02em}
#info svg{position:absolute;left:255px;top:120px;width:210px;height:540px;filter:drop-shadow(0 20px 24px rgba(15,30,54,.18))}
.call{position:absolute;display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 10px 24px rgba(15,30,54,.12);width:210px;font-size:20px;font-weight:700;color:#0b1a33}
.call i{font-style:normal;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#0a6cf1,#06c2f6);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.call small{display:block;font-weight:500;color:#53627a;font-size:15px}
/* after: dimensions */
#dims{background:#fff}
#dims svg.b{position:absolute;left:250px;top:90px;width:200px;height:520px}
#dims .v{position:absolute;left:190px;top:100px;height:500px;border-left:3px solid #0a6cf1}
#dims .v::before,#dims .v::after{content:"";position:absolute;left:-10px;width:17px;border-top:3px solid #0a6cf1}
#dims .v::before{top:0}#dims .v::after{bottom:0}
#dims .vl{position:absolute;left:100px;top:330px;font-size:28px;font-weight:800;color:#0a6cf1;transform:rotate(-90deg)}
#dims .h{position:absolute;left:262px;top:640px;width:176px;border-top:3px solid #0a6cf1}
#dims .hl{position:absolute;left:300px;top:655px;font-size:28px;font-weight:800;color:#0a6cf1}
#dims .spec{position:absolute;right:40px;top:200px;display:grid;gap:14px}
#dims .spec div{background:#f3f8ff;border-radius:14px;padding:12px 16px;font-size:20px;font-weight:700;color:#0b1a33;width:180px}
#dims .spec small{display:block;color:#53627a;font-weight:500;font-size:15px}
/* after: lifestyle */
#life{background:linear-gradient(180deg,#9fd6ff 0%,#d9f0ff 45%,#f7e7c9 46%,#e9cf9f 100%)}
#life .sun{position:absolute;right:90px;top:70px;width:110px;height:110px;border-radius:50%;background:radial-gradient(#fff6c8,#ffd36b)}
#life .m1{position:absolute;left:-60px;top:200px;width:0;height:0;border-left:260px solid transparent;border-right:260px solid transparent;border-bottom:150px solid #6fa8c9}
#life .m2{position:absolute;left:260px;top:170px;width:0;height:0;border-left:300px solid transparent;border-right:300px solid transparent;border-bottom:180px solid #5b93b8}
#life .rock{position:absolute;left:150px;top:520px;width:420px;height:120px;border-radius:50% 50% 12px 12px;background:linear-gradient(180deg,#a68a64,#7d6648)}
#life svg{position:absolute;left:285px;top:180px;width:150px;height:390px;filter:drop-shadow(0 14px 14px rgba(0,0,0,.25))}
#life .cap{position:absolute;left:36px;bottom:36px;background:rgba(255,255,255,.92);border-radius:14px;padding:12px 18px;font-size:24px;font-weight:800;color:#0b1a33}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#0b4a8c"/><stop offset=".35" stop-color="#1f7fe0"/><stop offset=".55" stop-color="#5fb3ff"/><stop offset=".75" stop-color="#1f7fe0"/><stop offset="1" stop-color="#0a3f7a"/></linearGradient>
<linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#7d8794"/><stop offset=".45" stop-color="#e9eef3"/><stop offset=".6" stop-color="#ffffff"/><stop offset="1" stop-color="#6f7884"/></linearGradient>
<linearGradient id="cap" x1="0" x2="1"><stop offset="0" stop-color="#111827"/><stop offset=".5" stop-color="#3b4655"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
<symbol id="bottle" viewBox="0 0 200 520">
<rect x="70" y="8" width="60" height="16" rx="8" fill="url(#cap)"/>
<path d="M60 26h80v34c0 6 5 10 10 14 16 12 26 30 26 52v350c0 22-18 40-40 40H64c-22 0-40-18-40-40V126c0-22 10-40 26-52 5-4 10-8 10-14z" fill="url(#cap)"/>
<path d="M58 70h84v16H58z" fill="url(#steel)"/>
<path d="M30 120c4-14 12-24 24-32h92c12 8 20 18 24 32v352c0 18-14 30-30 30H60c-16 0-30-12-30-30z" fill="url(#body)"/>
<rect x="58" y="230" width="84" height="90" rx="10" fill="rgba(255,255,255,.14)"/>
<text x="100" y="268" text-anchor="middle" font-family="Segoe UI,Arial" font-weight="800" font-size="20" fill="#fff">YourBrand</text>
<text x="100" y="296" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#dbeafe">750 ml</text>
<rect x="44" y="130" width="10" height="330" rx="5" fill="rgba(255,255,255,.35)"/>
</symbol></defs></svg>

<div class="tile" id="before"><div class="desk"></div><div class="clutter1"></div><div class="clutter2"></div><div class="clutter3"></div><svg viewBox="0 0 200 520"><use href="#bottle"/></svg><div class="glare"></div></div>

<div class="tile" id="hero"><span class="badge">Keeps drinks cold 24 h</span><svg viewBox="0 0 200 520"><use href="#bottle"/></svg><div class="shadow"></div></div>

<div class="tile" id="info"><h2>Built for every day</h2><svg viewBox="0 0 200 520"><use href="#bottle"/></svg>
<div class="call" style="left:30px;top:170px"><i>❄</i><div>24 h cold<small>Double-wall vacuum</small></div></div>
<div class="call" style="left:30px;top:420px"><i>☕</i><div>12 h hot<small>Steel inner wall</small></div></div>
<div class="call" style="right:30px;top:230px"><i>✓</i><div>Leak-proof<small>Sealed screw lid</small></div></div>
<div class="call" style="right:30px;top:480px"><i>♻</i><div>BPA-free<small>Reusable, no plastic taste</small></div></div>
</div>

<div class="tile" id="dims"><svg class="b" viewBox="0 0 200 520"><use href="#bottle"/></svg><div class="v"></div><div class="vl">27 cm</div><div class="h"></div><div class="hl">7.5 cm</div>
<div class="spec"><div>750 ml<small>Capacity</small></div><div>380 g<small>Weight</small></div><div>18/8 steel<small>Inner wall</small></div></div></div>

<div class="tile" id="life"><div class="sun"></div><div class="m1"></div><div class="m2"></div><div class="rock"></div><svg viewBox="0 0 200 520"><use href="#bottle"/></svg><div class="cap">Made for the trail</div></div>

<script>document.getElementById((location.hash||'#hero').slice(1)).classList.add('on')</script>
</body></html>
